version: "3.8"

services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        image: agentic-saas-backend:latest
        ports:
            - "8000:8000"
        environment:
            - PYTHONDONTWRITEBYTECODE=1
            - PYTHONUNBUFFERED=1
        volumes:
            - .:/app
        command: ["python", "main.py"]
        restart: unless-stopped
