version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: agentic-saas-backend:latest
    container_name: agent_backend # waits for migrations
    env_file:
      - .env
    environment:
      PYTHONPATH: /app
    ports:
      - "8000:8000"
    command: ["uv", "run", "uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped

volumes:
  mysql_data:
